<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전공 교재 접근성 변환기</title>
<link rel="stylesheet" href="/web/a11y.css">
<style>
body {
  font-size: 1.2rem;
  text-align: center;
}
h1 { font-size: 2.25rem; }
h2 { font-size: 1.6rem; }
.hint { font-size: 1.05rem; }
input[type="number"] { width: 5ch; box-sizing: content-box; }
#file { max-width: 100%; }
#file::file-selector-button, #start, #stop {
  background: #739FF5;
  color: #172033;
  border: 0;
  border-radius: 14px;
  font: inherit;
  font-weight: 700;
  padding: .65em 1.25em;
  min-height: 48px;
  cursor: pointer;
}
#file::file-selector-button { margin-inline-end: .6em; }
#start, #stop { min-width: 9rem; }
#start:focus-visible, #stop:focus-visible { outline-color: var(--fg); }
#start:disabled, #stop:disabled { cursor: default; }
#conversion-panel { margin-block: 2rem 1rem; }
#conversion-title { margin-top: 0; }
#progress:empty { border: 0; padding: 0; margin: 0; }
</style>
</head>
<body>

<a class="skip" href="#main">본문 바로가기</a>

<header>
  <h1>전공 교재 접근성 변환기</h1>
  <p>교재 PDF를 올리면 도표·수식·각주까지 읽을 수 있는 형태로 바꿔 드립니다.
     결과는 스크린리더로 읽거나 음성으로 들을 수 있습니다.</p>
  <p id="health" role="status">연결 상태를 확인하는 중입니다.</p>
</header>

<main id="main">
<form id="form">

  <section>
    <h2>파일 선택</h2>
    <p>
      <label for="file">교재 파일 (PDF 또는 이미지)</label><br>
      <input type="file" id="file" name="file" accept=".pdf,.png,.jpg,.jpeg" required>
    </p>
    <p id="file-info" role="status"></p>
  </section>

  <section>
    <h2>변환 설정</h2>
    <p>
      <label for="page-from">시작 쪽</label>
      <input type="number" id="page-from" name="page_from" min="1" value="1"
             aria-describedby="page-help">
      <label for="page-to">끝 쪽</label>
      <input type="number" id="page-to" name="page_to" min="1" value="3"
             aria-describedby="page-help">
    </p>
    <p id="page-help" class="hint">한 번에 최대 20쪽까지 변환합니다. 쪽당 1분 안팎 걸립니다.</p>
    <p id="estimate" role="status"></p>

    <p>
      <input type="checkbox" id="speak">
      <label for="speak">안내를 소리로 읽어 주기</label>
      <span class="hint">— 스크린리더를 쓰고 있다면 꺼 두세요. 두 번 들립니다.</span>
    </p>

    <fieldset>
      <legend>각주 읽기 방식</legend>
      <p>
        <input type="radio" id="fn-end" name="footnote_mode" value="end" checked>
        <label for="fn-end">문서 끝에 모아서</label>
        <span class="hint">— 표준 방식. 링크로 갔다가 돌아옵니다.</span>
      </p>
      <p>
        <input type="radio" id="fn-inline" name="footnote_mode" value="inline">
        <label for="fn-inline">본문 중간에 바로</label>
        <span class="hint">— 음성으로 들을 때 편합니다.</span>
      </p>
    </fieldset>

    <fieldset>
      <legend>처리 방식</legend>
      <p>
        <input type="radio" id="mode-auto" name="mode" value="auto" checked>
        <label for="mode-auto">자동 (인터넷을 쓸 수 있으면 사용)</label>
      </p>
      <p>
        <input type="radio" id="mode-offline" name="mode" value="offline">
        <label for="mode-offline">오프라인 전용 (미리 준비된 결과만 사용)</label>
      </p>
    </fieldset>
  </section>

  <section>
    <h2>변환 시작</h2>
    <p>
      <button type="submit" id="start">변환 시작</button>
    </p>
  </section>

</form>
<section id="conversion-panel" aria-labelledby="conversion-title" hidden>
  <h2 id="conversion-title" tabindex="-1">문서를 변환 중입니다</h2>
  <button type="button" id="stop">변환 중단</button>
</section>
<div id="progress" role="status"></div>
<div id="error" role="alert" hidden></div>
</main>

<script src="/web/upload.js" type="module"></script>
</body>
</html>
