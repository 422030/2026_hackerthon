<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>변환 결과 — 전공 교재 음성 변환기</title>
<link rel="stylesheet" href="/web/a11y.css">
<style>
  body { text-align: center; }
  .toolbar { display: grid; gap: 12px; border: 1px solid var(--line);
             border-radius: 6px; padding: 12px; }
  #doc, .compare { text-align: start; }
  #speech-status:empty { margin: 0; padding: 0; border: 0; }
  .playback-controls, .speed-controls {
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .playback-progress { display: grid; justify-items: center; gap: 4px; }
  .playback-progress progress { width: min(100%, 24rem); accent-color: #739FF5; }
  .playback-progress p { margin: 0; font-size: .9rem; }
  .playback-controls button { min-width: 0; }
  .speed-controls input { min-width: 0; width: 10rem; padding: 0; }
  .speed-controls label, .speed-controls output { flex-shrink: 0; }
  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 760px) { .compare { grid-template-columns: 1fr; } }
  pre { white-space: pre-wrap; word-break: break-all; font-size: 0.92rem;
        border: 1px solid var(--line); padding: 12px; }
  .new-conversion { display: inline-flex; align-items: center; justify-content: center;
                    padding: .65em 1.25em; min-height: 48px; text-decoration: none; }
  button, .new-conversion { background: #739FF5; color: #172033; border: 0; border-radius: 14px; font-weight: 700; }
  button:focus-visible { outline-color: var(--fg); }
  .playback-controls button {
    background: #fff; color: #111; border: 1px solid #111;
  }
  #prev, #next { font-size: .9rem; padding: 6px 12px; }
  #play { display: inline-grid; place-items: center; min-width: 64px; min-height: 52px; }
  .play-icon { width: 0; height: 0; border-block: 9px solid transparent;
               border-left: 15px solid currentColor; }
  #play[aria-pressed="true"] .play-icon {
    width: 14px; height: 18px; border: 0; border-inline: 4px solid currentColor;
  }
  .result-view { margin-block: 1.5rem; }
  .result-view h2 { margin: 0 0 .5rem; }
  #tab-compare { background: #A2ABB5; font-size: .9rem; padding: 4px 12px; }
</style>
</head>
<body>

<a class="skip" href="#doc">본문 바로가기</a>

<header>
  <h1 id="doc-title">변환 결과</h1>
  <p id="doc-summary" role="status">불러오는 중입니다.</p>
  <p><a class="new-conversion" href="/">새로운 파일 변환하기</a></p>

  <div id="retry-box" role="group" aria-labelledby="retry-msg" hidden>
    <p id="retry-msg"></p>
    <p><button type="button" id="retry">실패한 쪽만 다시 변환</button></p>
    <p id="retry-status" role="status"></p>
  </div>
</header>

<div class="result-view">
  <h2 id="reading-title">음성으로 재생</h2>
  <button type="button" id="tab-compare" aria-controls="panel-compare" aria-expanded="false">일반 OCR과 비교</button>
</div>

<main>

<section id="panel-read" aria-labelledby="reading-title">

  <div class="toolbar" role="toolbar" aria-label="읽기 도구">
    <div class="playback-controls">
      <button id="prev">이전 단락</button>
      <button id="play" aria-label="음성 재생" aria-pressed="false"><span class="play-icon" aria-hidden="true"></span></button>
      <button id="next">다음 단락</button>
    </div>
    <div class="playback-progress">
      <progress id="audio-progress" aria-label="음성 재생 진행률" max="1" value="0"></progress>
      <p id="audio-time">0:00 / 0:00 (예상)</p>
    </div>
    <div class="speed-controls">
      <label for="rate">읽기 속도 조정</label>
      <input type="range" id="rate" min="0.5" max="2.5" step="0.1" value="1.1">
      <output for="rate" id="rate-out">1.1배</output>
    </div>
  </div>
  <p id="speech-status" role="status"></p>

  <article id="doc" lang="ko" tabindex="-1"></article>
</section>

<section id="panel-compare" aria-labelledby="compare-title" hidden>
  <h2 id="compare-title">일반 OCR과 비교</h2>
  <div class="compare">
    <section>
      <h3>일반 OCR 결과</h3>
      <p class="hint">구조 정보 없음. 도표 설명 없음.</p>
      <pre id="baseline">불러오는 중</pre>
    </section>
    <section>
      <h3>본 시스템 결과</h3>
      <p class="hint" id="ours-summary"></p>
      <pre id="ours">불러오는 중</pre>
    </section>
  </div>
</section>

</main>

<script src="/web/result.js" type="module"></script>
</body>
</html>
