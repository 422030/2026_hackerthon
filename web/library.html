<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>보관함 — 전공 교재 접근성 변환기</title>
<link rel="stylesheet" href="/web/a11y.css">
<style>
  .book { margin: 2em 0; }
  .book > h3 { margin: 0 0 2px; }
  .book > .meta { margin: 0 0 10px; }
  .item { border: 1px solid var(--line); border-radius: 8px;
          padding: 12px 16px; margin: 10px 0 10px 16px; }
  .item h4 { margin: 0 0 6px; font-size: 1.05rem; }
  .meta { color: var(--muted); font-size: 0.95rem; }
  .actions { margin-top: 8px; display: flex; gap: 12px; flex-wrap: wrap;
             align-items: center; }
  .danger { color: var(--warn); }
</style>
</head>
<body>

<a class="skip" href="#main">본문 바로가기</a>

<header>
  <h1>보관함</h1>
  <p>이미 변환해 둔 교재입니다. 교재별로 묶어서 보여 줍니다.
     같은 교재를 다시 변환할 필요가 없습니다.</p>
  <p><a href="/">새로 변환하기</a></p>
</header>

<main id="main">
  <h2 class="sr-only">변환된 교재 목록</h2>
  <p id="status" role="status">불러오는 중입니다.</p>
  <div id="list"></div>
</main>

<script src="/web/library.js" type="module"></script>
</body>
</html>
